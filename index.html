.foot{text-align:center;color:#9aa9b8;font-size:11px;margin-top:18px;line-height:1.8}

,"q":"雷电的种类中，危害最大的是（　）。","o":["感应雷","直击雷","球形雷","雷电侵入波"],"a":"B","e":"直击雷电压电流极高，破坏性最强。"},{"m":"M8","t":"判断","q":"避雷针的作用是将雷电流引入大地，保护其周围一定范围内的物体。","o":[],"a":"√","e":"避雷针由接闪器、引下线、接地装置组成。"},{"m":"M8","t":"单选","q":"独立避雷针的接地电阻一般不应大于（　）Ω。","o":["4","10","30","100"],"a":"B","e":"防雷接地一般要求不大于10Ω。"},{"m":"M8","t":"判断","q":"雷雨天气应避免在树下、电杆旁和高处停留。","o":[],"a":"√","e":"这些位置易遭受雷击。"},{"m":"M8","t":"单选","q":"电气火灾发生的原因不包括（　）。","o":["短路","过载","电压稳定","接触不良"],"a":"C","e":"短路、过载、接触不良、漏电、散热不良等是主因。"},{"m":"M8","t":"判断","q":"导线长期过载运行会使绝缘加速老化，最终可能引燃周围可燃物。","o":[],"a":"√","e":"过载使导线温度升高，超过绝缘耐受温度。"},{"m":"M8","t":"单选","q":"电气设备着火后，在未切断电源的情况下（　）。","o":["可用水直接扑救","可用于泡沫扑救","无需处理","应用不导电的灭火剂扑救"],"a":"D","e":"水、泡沫导电，会造成触电和火势扩大。"},{"m":"M8","t":"判断","q":"消防应急照明和疏散指示标志应能在断电后自动投入工作。","o":[],"a":"√","e":"应急照明持续时间一般不少于30分钟。"},{"m":"M8","t":"单选","q":"易燃易爆场所的电气设备外壳应（　）。","o":["可靠接地","不接地","接零即可不接地","绝缘隔离"],"a":"A","e":"可靠接地可防止静电积聚和外壳带电。"},{"m":"M8","t":"判断","q":"雷雨天应尽量不使用有线电话和拔掉不必要的电源插头。","o":[],"a":"√","e":"雷电可能沿线路侵入室内造成伤害。"},{"m":"M1","t":"判断","q":"特种作业操作证每3年需要复审一次，复审不合格证书即失效。","o":[],"a":"×","e":"为什么：应急管理部令第19号自2026年6月1日起已取消“3年复审”，改为“6年到期换证”。易错点：网上和旧教材大量仍是“3年复审”说法，这是2026年前的旧规定，考到按新规答。记忆：老规矩三年一审，新规矩六年一换。"},{"m":"M1","t":"判断","q":"低压电工作业证只能用于低压电工作业，不能凭它去做高压电工作业或焊接作业。","o":[],"a":"√","e":"为什么：特种作业各操作项目之间“不递进、不兼容”，必须分别培训、分别考核取证。易错点：有人以为“低压做熟了就能干高压”，属于典型的无证上岗。记忆：一证一项目，跨项就无证。"},{"m":"M1","t":"判断","q":"特种作业操作证在全国范围内有效，到外省从业不需要重新换发当地证书。","o":[],"a":"√","e":"为什么：部令第19号第二十三条明确有效期6年、全国有效，实体证与电子证同效力。易错点：个别机构宣称“到外地要换当地证”，多为收费套路。"},{"m":"M1","t":"判断","q":"用人单位可以安排未取得低压电工证的人员临时顶岗，只要现场有持证人员监护即可。","o":[],"a":"×","e":"为什么：无证人员不得从事特种作业，监护不能替代持证，单位会被处10万元以下罚款，逾期未改正处10万～20万元。易错点：“有人看着就行”是最常见的违法借口。记忆：监护管安全，不管资格。"},{"m":"M1","t":"判断","q":"低压电工作业属于《特种作业目录》中“电工作业”类别，证书由应急管理部门颁发。","o":[],"a":"√","e":"为什么：电工作业下分低压电工、高压电工等操作项目，统一由应急管理部门考核发证。易错点：容易与住建部门的“建筑电工”、人社部门的“电工职业资格/技能等级证”混淆，那两种不能代替特种作业操作证上岗。"},{"m":"M1","t":"单选","q":"某电工的证书有效期至2028年5月10日，他最迟应在（　）前完成安全技术理论培训和理论考试。","o":["2027年5月10日","2027年11月10日","2028年3月10日","2028年4月10日"],"a":"B","e":"为什么：换证要求“届满前6个月内”完成理论培训和理论考试，2028-05-10往前推6个月即2027-11-10。易错点：把“6个月内”误当成“届满前6个月那一天才开始”，其实是最迟时限。记忆：先培训考试（提前半年），再申请换证（提前60天）。"},{"m":"M1","t":"单选","q":"下列情形中，需要按“首次取证”重新办理的是（　）。","o":["证书失效8个月","证书失效14个月","证书在有效期内正常换证","已申请延期换证且在延期期内"],"a":"B","e":"为什么：失效未超过1年按换证办理，超过1年按首次取证办理（要重新培训并考实操）。易错点：以为“失效多久都能补换”，超过1年就得从头来。"},{"m":"M1","t":"单选","q":"低压电工初次取证的安全技术实际操作培训学时数为（　）学时。","o":["24","32","48","72"],"a":"C","e":"为什么：2025版考核标准规定初次取证实操培训48学时，其中科目三“安全操作技术”占20学时最多。易错点：把“理论培训学时”和“实操培训学时”记混。"},{"m":"M1","t":"单选","q":"复审/换证时，安全技术理论培训的学时为（　）学时。","o":["4","8","16","24"],"a":"B","e":"为什么：换证只考理论，培训8学时，内容是最新法规、新工艺新技术新材料新设备、事故案例分析。易错点：以为是“把初次的课再上一遍”。"},{"m":"M1","t":"单选","q":"生产经营单位使用未取得特种作业操作证的人员上岗，逾期未改正的，可处（　）罚款。","o":["2万元以下","2万～5万元","10万～20万元","50万元以上"],"a":"C","e":"为什么：部令第19号罚则：先责令限期改正并处10万元以下罚款；逾期未改正的，责令停产停业整顿并处10万～20万元，同时对直接责任人处2万～5万元。易错点：把“单位罚款”和“责任人罚款”两个数额记混。记忆：单位十万起步、最高二十；个人二到五万。"},{"m":"M2","t":"判断","q":"两个电阻并联后的总电阻，一定小于其中任何一个分电阻。","o":[],"a":"√","e":"为什么：并联相当于把导体加粗，1/R=1/R1+1/R2，故总电阻比分电阻都小。易错点：直觉上“加起来”容易算成串联的加法。记忆：并联越并越小，串联越串越大。"},{"m":"M2","t":"判断","q":"三相四线制中，三根相线的电压有效值相等，相位互差120°。","o":[],"a":"√","e":"为什么：三相绕组在空间上对称分布，感应出的电动势大小相等、相位依次差120°，合成后总功率恒定。易错点：以为三根火线“电压不同”，其实有效值都是220V（对零线）。"},{"m":"M2","t":"判断","q":"无功功率不消耗能量，所以对电网运行没有任何影响。","o":[],"a":"×","e":"为什么：无功功率虽不做功，但会占用变压器和线路容量、增大线路电流和损耗、造成电压降落。易错点：“不做功＝没关系”是错的，工厂要装电容补偿提高功率因数。"},{"m":"M2","t":"判断","q":"导体的电阻与材料的电阻率成正比，与长度成正比，与截面积成反比。","o":[],"a":"√","e":"为什么：R=ρL/S，这是选导线截面、算电压损失的基本公式。易错点：把“截面积”记成“直径”，截面是直径的平方关系。"},{"m":"M2","t":"单选","q":"某电阻两端电压为6V，通过它的电流为0.5A，其阻值为（　）Ω。","o":["3Ω","6Ω","12Ω","0.08Ω"],"a":"C","e":"为什么：R=U/I=6÷0.5=12Ω。易错点：把公式写成R=U×I。记忆：U=IR，三个量知二求一。"},{"m":"M2","t":"单选","q":"一台额定电压220V、额定功率1000W的电热水器，其额定电流约为（　）A。","o":["2.2A","4.5A","5.5A","10A"],"a":"B","e":"为什么：纯电阻负载I=P/U=1000÷220≈4.5A。易错点：直接拿1000当电流。记忆：220V下1kW约4.5A，估算导线和空开都用这个数。"},{"m":"M2","t":"单选","q":"某三相异步电动机铭牌标注“380V/220V、Y/△”，电源线电压为380V时，定子绕组应接成（　）。","o":["三角形（△）","Y或△都可以","星形（Y）","先Y后△长期运行"],"a":"C","e":"为什么：铭牌“380V对应Y、220V对应△”，即每相绕组额定电压220V，接成Y时每相承受220V，正好匹配。易错点：看到380V就接△，会把每相绕组加压到380V而烧毁。记忆：铭牌斜杠前后要一一对应，电压高接Y、电压低接△。"},{"m":"M2","t":"单选","q":"某感性负载的功率因数由0.8提高到0.95后，线路电流将（　）。","o":["增大","不变","先增大后减小","减小"],"a":"D","e":"为什么：P=UIcosφ，有功不变时cosφ提高，电流I减小，线路损耗随之下降。易错点：以为补偿电容会“多耗电”，其实电容不消耗有功。"},{"m":"M2","t":"单选","q":"两个分别标有“220V 100W”和“220V 40W”的灯泡串联后接在220V电源上，亮度是（　）。","o":["40W的亮","100W的亮","一样亮","都不亮"],"a":"A","e":"为什么：串联电流相同，P=I²R，40W灯泡电阻大（R=U²/P），实际功率反而大，所以更亮。易错点：按额定功率判断亮度，忽略了串联时电压重新分配。记忆：串联比电阻，电阻大的亮；并联比功率，功率大的亮。"},{"m":"M2","t":"单选","q":"1马力（公制）约等于（　）kW。","o":["0.5kW","0.736kW","1kW","1.36kW"],"a":"B","e":"为什么：1马力≈735.5W≈0.736kW，老设备铭牌常标马力，选电缆和空开时要换算。易错点：与英制马力（0.746kW）混用，工程上按0.75估算即可。"},{"m":"M3","t":"判断","q":"用万用表测电阻时可以带电测量，只要手不碰表笔金属部分就行。","o":[],"a":"×","e":"为什么：带电测电阻既测不准，还可能烧表；必须先断电、放电再测。易错点：“手不碰就行”是典型误区，危险来自被测电路不是手。"},{"m":"M3","t":"判断","q":"兆欧表测完绝缘电阻后，应先断开L端连线，再停止摇动，防止设备电容反充电损坏仪表。","o":[],"a":"√","e":"为什么：被测设备相当于电容，摇动中已充电，直接停摇会反向放电冲击表头。易错点：测完随手一放，既不放电也不拆线。"},{"m":"M3","t":"判断","q":"雷雨天气可以用接地电阻测试仪测量接地电阻。","o":[],"a":"×","e":"为什么：雷雨天土壤湿润读数失真，更严重的是接地体可能带电，测量人员有遭雷击和触电风险。易错点：以为“下雨土壤湿测得更准”。"},{"m":"M3","t":"单选","q":"测量1.5V干电池的电压，万用表应选（　）挡。","o":["交流电压10V","直流电压2.5V","直流电压250V","电阻挡"],"a":"B","e":"为什么：干电池是直流，量程略大于被测值读数最准：2.5V挡测1.5V正合适。易错点：用交流挡测直流会读数为零或严重偏差。"},{"m":"M3","t":"单选","q":"用钳形电流表测小电流时，把导线在钳口内绕了3圈，读数为1.2A，实际电流为（　）A。","o":["0.4A","1.2A","3.6A","0.3A"],"a":"A","e":"为什么：绕3圈相当于把电流放大3倍，实际值＝读数÷圈数＝1.2÷3＝0.4A。易错点：乘除搞反，记成“除以圈数”。记忆：绕几圈就放大几倍，读数往回除。"},{"m":"M3","t":"单选","q":"用500V兆欧表测得某设备绝缘电阻为0.3MΩ，正确处理是（　）。","o":["可投入运行","直接送电试运行","烘干处理后再测，合格方可投运","不影响使用"],"a":"C","e":"为什么：低压设备绝缘电阻不应低于0.5MΩ，0.3MΩ说明受潮或绝缘老化，须烘干处理并复试。易错点：只看“有读数”就投运。"},{"m":"M3","t":"单选","q":"电流表的内阻应当（　）。","o":["越大越好","等于负载电阻","无穷大","越小越好"],"a":"D","e":"为什么：电流表串联在电路中，内阻越小对原电路影响越小、测量越准。易错点：与电压表搞混——电压表并联，内阻越大越好。记忆：电流表串小、电压表并大。"},{"m":"M3","t":"单选","q":"用万用表测量220V交流电压，应把转换开关置于（　）。","o":["交流电压挡（250V以上量程）","直流电压挡","电阻挡","电流挡"],"a":"A","e":"为什么：被测的是交流，且220V需选大于220V的量程（如交流250V或750V）。易错点：量程选小了会打表甚至烧表。"},{"m":"M4","t":"判断","q":"触电者心跳呼吸停止时，应先送医院再抢救，路上再想办法。","o":[],"a":"×","e":"为什么：心搏骤停4～6分钟即造成不可逆脑损伤，必须就地心肺复苏，边救边等救护车。易错点：“先送医”是最常见的致命错误。记忆：就地救，不搬动。"},{"m":"M4","t":"判断","q":"胸外按压时手臂应伸直，靠上身重量垂直向下用力，按压后让胸廓充分回弹。","o":[],"a":"√","e":"为什么：手臂伸直用体重下压才够深度（5～6cm）且不易疲劳，充分回弹才能保证心脏舒张充盈。易错点：只用手臂力量、按压后手不离胸、回弹不充分。"},{"m":"M4","t":"判断","q":"触电者还能说话、还能走动，就说明没有生命危险，不必观察。","o":[],"a":"×","e":"为什么：电击后可能发生迟发性心律失常、休克，必须就地休息并观察，不能让其走动。易错点：以“能说话”判断安全。"},{"m":"M4","t":"判断","q":"雷雨天在户外应远离金属栏杆、天线、高大树木和电杆。","o":[],"a":"√","e":"为什么：这些位置易遭直击雷，且接地体附近存在跨步电压。易错点：躲在大树下避雨是最危险的做法之一。"},{"m":"M4","t":"判断","q":"接地故障点附近的跨步电压对人体没有危害。","o":[],"a":"×","e":"为什么：离接地点越近，两脚间的电位差越大，可能达到致命电压，必须单脚跳或双脚并拢小步撤离。易错点：以为只有“碰到电线”才危险。"},{"m":"M4","t":"单选","q":"成人胸外按压的正确位置是（　）。","o":["心尖部（左胸第五肋）","胸骨下半部（两乳头连线中点）","胸骨上端","剑突处"],"a":"B","e":"为什么：按压胸骨下半部通过挤压心脏泵血，位置偏上无效、偏下（剑突）易造成肝脾破裂。易错点：按在左胸心尖处，这是影视剧里的错误示范。"},{"m":"M4","t":"单选","q":"发现有人触电且一时无法切断电源，可用（　）挑开导线。","o":["湿毛巾","金属管","干燥的木棒或竹竿","直接用手"],"a":"C","e":"为什么：干燥木材是绝缘体，救护者还应站在干燥绝缘物上，避免自身触电。易错点：用湿物、金属物或徒手施救，会造成连环触电。"},{"m":"M4","t":"单选","q":"成人心肺复苏开放气道常用的方法是（　）。","o":["低头法","侧卧位","按压腹部","仰头抬颏法"],"a":"D","e":"为什么：仰头抬颏使舌根离开咽后壁，气道才能通畅，吹气才有效。易错点：怀疑颈椎损伤时应用推举下颌法（双手托下颌）而不是仰头。"},{"m":"M4","t":"单选","q":"触电者呼吸停止但心跳存在时，应采用（　）。","o":["口对口人工呼吸","单纯胸外按压","心肺复苏全套（按压＋通气）","立即送医"],"a":"A","e":"为什么：有心跳说明循环尚可，此时需要的是人工通气；一旦心跳也停止，才做按压＋通气30:2。易错点：不分情况一律做按压。"},{"m":"M4","t":"单选","q":"触电者皮肤出现电灼伤，现场正确处理是（　）。","o":["涂抹酱油、牙膏","先脱离电源，再用干净敷料覆盖，尽快送医","立即挑破水泡","用冷水长时间浸泡"],"a":"B","e":"为什么：现场只需防止污染和二次损伤，涂抹异物会加重感染、影响医生判断伤情。易错点：迷信偏方，往伤口上涂东西。"},{"m":"M5","t":"判断","q":"在36V安全电压场所，若改用220V行灯，只要加装漏电保护器就同样安全。","o":[],"a":"×","e":"为什么：安全电压靠“降低电压”从根上限制电流；220V即使有漏保，一旦漏保拒动或人同时接触两相仍会致命。易错点：把漏保当成“万能的保命符”。记忆：漏保是附加保护，安全电压才是本质安全。"},{"m":"M5","t":"判断","q":"剩余电流动作保护器（RCD）不能防止两相触电和相间短路。","o":[],"a":"√","e":"为什么：RCD检测的是“相线与中性线电流之差”，两相触电或相间短路时电流不经中性线回流，差值为零，不会动作。易错点：以为装了漏保就什么触电都不怕。"},{"m":"M5","t":"判断","q":"在TN-S系统中，设备的金属外壳可以直接接在N线（工作零线）上。","o":[],"a":"×","e":"为什么：N线正常有电流、可能断线或电位偏移，外壳接N会带电；必须接PE线。易错点：把N和PE看成“都是零”，这是最危险的混淆之一。"},{"m":"M5","t":"判断","q":"Ⅲ类手持电动工具由安全特低电压电源供电，其额定电压不超过50V。","o":[],"a":"√","e":"为什么：Ⅲ类工具靠“特低电压”实现本质安全，不需要接地保护。易错点：与Ⅱ类（双重绝缘、回字形标志、不接地）混淆。"},{"m":"M5","t":"判断","q":"等电位联结可以代替保护接地使用。","o":[],"a":"×","e":"为什么：等电位联结消除的是“可同时触及部件之间的电位差”，不能代替把故障电流引入大地的保护接地/接零。易错点：以为做了等电位就可以不接地。"},{"m":"M5","t":"单选","q":"TN系统中，PE（保护线）上（　）。","o":["可装熔断器","可装单极开关","严禁装设开关和熔断器","可串接负载"],"a":"C","e":"为什么：PE线一旦被开关或熔断器断开，故障时外壳就失去保护，人身安全无保障。易错点：检修时随手在PE上加个开关。"},{"m":"M5","t":"单选","q":"漏电保护器动作跳闸后，正确处理是（　）。","o":["直接合闸恢复供电","更换更大动作电流的漏保","把漏保短接","查明原因、排除故障后再合闸"],"a":"D","e":"为什么：动作说明线路存在漏电或接地故障，盲目重合闸会反复跳闸甚至引发事故；短接漏保属严重违章。易错点：图省事直接把漏保“旁路”。"},{"m":"M5","t":"单选","q":"手持电动工具按防触电保护方式分为（　）类。","o":["2类","3类","4类","5类"],"a":"B","e":"为什么：Ⅰ类靠基本绝缘＋接地，Ⅱ类靠双重绝缘（回字形标志），Ⅲ类靠安全特低电压。易错点：把Ⅱ类的“回”字标志当成“二类设备不用检查”。"},{"m":"M5","t":"单选","q":"Ⅰ类手持电动工具使用时必须（　）。","o":["可靠接地（接零）并配漏电保护器","双重绝缘即可","不需要任何保护","只能室内使用"],"a":"A","e":"为什么：Ⅰ类工具只有基本绝缘，一旦绝缘损坏外壳带电，必须靠接地（接零）和漏保双重保护。易错点：以为“有漏保就不用接地”。"},{"m":"M5","t":"单选","q":"装设临时接地线时应使用（　）。","o":["单股铜线","多股软铜线且截面满足短路电流要求","铁丝","铝绞线"],"a":"B","e":"为什么：接地线要承受短路电流冲击，必须用多股软铜线（一般不小于25mm²），且先接接地端后接导体端。易错点：用细铁丝、铝线凑合，短路时直接烧断。"},{"m":"M6","t":"判断","q":"交流接触器的线圈额定电压必须与主电路电压相同。","o":[],"a":"×","e":"为什么：线圈电压按控制回路电源选（常见220V、380V、36V），与主电路电压是两回事。易错点：主电路380V就买380V线圈，控制回路却是220V，结果吸合不了或烧线圈。"},{"m":"M6","t":"判断","q":"热继电器的热元件串接在主电路中，其常闭触点串接在控制回路中。","o":[],"a":"√","e":"为什么：热元件感受主电路电流发热，动作后常闭触点断开控制回路，使接触器释放，电动机停机。易错点：把热元件接到控制回路，起不到过载保护作用。"},{"m":"M6","t":"判断","q":"电动机运行时温升越高越好，说明散热性能好。","o":[],"a":"×","e":"为什么：温升是发热与散热的平衡结果，温升过高会加速绝缘老化，超过允许温升即缩短寿命甚至烧毁。易错点：把“不烫手”与“温升合格”混为一谈。"},{"m":"M6","t":"判断","q":"电动机点动控制线路中没有自锁触点，松开按钮即停机。","o":[],"a":"√","e":"为什么：点动靠按钮常开触点直接给接触器线圈供电，无自锁；连续运转则并联接触器常开触点实现自锁。易错点：把点动与连续运转的接线混为一谈，实操接线题常考这个区别。"},{"m":"M6","t":"判断","q":"熔断器的熔体选得越粗越好，可以避免频繁熔断。","o":[],"a":"×","e":"为什么：熔体过粗会失去保护作用，线路过载时导线先烧毁；熔体额定电流应大于线路计算电流、小于导线允许载流量。易错点：为“少跳闸”随意加大熔体或用铜丝代替。"},{"m":"M6","t":"单选","q":"三相异步电动机直接全压启动时，启动电流约为额定电流的（　）倍。","o":["1～2倍","4～7倍","10～15倍","20倍以上"],"a":"B","e":"为什么：启动瞬间转子静止、转差率s=1，转子回路等效电阻最小，定子电流可达额定值的4～7倍。易错点：以为“启动电流大所以启动转矩也大”，其实启动转矩并不大。"},{"m":"M6","t":"单选","q":"接触器控制回路中，停止按钮应使用（　）。","o":["常开触点","自锁触点","常闭触点","无严格要求"],"a":"C","e":"为什么：停止按钮用常闭触点，正常时回路导通，按下断开使接触器释放；断线时也能停机（失效安全）。易错点：把启停按钮的触点类型接反，导致一送电就启动或按了不停。"},{"m":"M6","t":"单选","q":"三相异步电动机采用Y-△降压启动时，启动电流降为直接启动的（　）。","o":["1/2","1/3","1/√3","1/4"],"a":"B","e":"为什么：Y接时每相电压降为△接的1/√3，相电流也降为1/√3，线电流降为1/3；启动转矩同样降为1/3。易错点：把“电压降1/√3”直接当成“电流降1/√3”。"},{"m":"M6","t":"单选","q":"低压断路器的电磁脱扣器用于（　）保护。","o":["过载","失压","漏电","短路"],"a":"D","e":"为什么：电磁脱扣器动作快、整定电流大，专管短路；热脱扣器利用双金属片延时动作，管过载。易错点：以为一个断路器只有一种保护。"},{"m":"M6","t":"单选","q":"电动机正反转控制中，两个接触器之间设置电气互锁的目的是（　）。","o":["防止两者同时吸合造成相间短路","节省导线","提高启动转矩","降低噪声"],"a":"A","e":"为什么：正反转是把任意两相调换，若两个接触器同时吸合，电源直接相间短路，必须电气互锁（常闭触点互相串接）。易错点：只装按钮机械互锁，触点熔焊时仍会短路。记忆：按钮互锁防误操作，电气互锁防短路。"},{"m":"M7","t":"判断","q":"插座回路的保护接地线（PE）可以与工作零线（N）共用一根导线。","o":[],"a":"×","e":"为什么：PE与N合并后，正常工作电流会使外壳带电压；断零时外壳直接带220V。易错点：“反正都是零”是最要命的错误认识。"},{"m":"M7","t":"判断","q":"导线穿管敷设时，同一回路的相线和零线应穿在同一根管内。","o":[],"a":"√","e":"为什么：同一回路导线同管穿设，电流往返抵消，不会在钢管中产生涡流发热；还能避免回路磁场不平衡。易错点：为省管把相线零线分两根管穿。"},{"m":"M7","t":"判断","q":"照明灯具可以直接固定在可燃吊顶上，无需任何隔热措施。","o":[],"a":"×","e":"为什么：灯具表面温度高，长期烘烤可燃材料会碳化起火，必须加隔热垫或保持安全距离。易错点：只看“装得牢”，不看“烤得着”。"},{"m":"M7","t":"判断","q":"导线在接线盒内的接头应采用压接或焊接，并做好绝缘包扎。","o":[],"a":"√","e":"为什么：接头是线路最薄弱点，接触电阻大会发热，缠绕不牢易松脱打火。易错点：随手拧两圈就包胶布，属于常见火灾隐患。"},{"m":"M7","t":"单选","q":"照明开关应串接在（　）上。","o":["零线","相线（火线）","保护地线","任意一根"],"a":"B","e":"为什么：开关接相线，断开后灯头不带电；接零线时关灯后灯头仍带电，换灯泡极易触电。易错点：图接线方便把开关接到零线上。"},{"m":"M7","t":"单选","q":"照明灯具安装高度低于（　）m时，应采取防护措施。","o":["1.5m","2.0m","2.5m","3.0m"],"a":"C","e":"为什么：一般场所灯具距地不应低于2.5m，低于时应加防护罩或采用安全电压，防止碰撞和触电。易错点：只记“2.5m”却不记“低于要防护”。"},{"m":"M7","t":"单选","q":"线路电压损失过大时，正确的处理措施是（　）。","o":["减小导线截面","增加负载","增大导线截面或缩短线路长度","提高负载功率"],"a":"C","e":"为什么：ΔU≈IR，电阻R=ρL/S，增大截面或缩短距离都能降低电阻，从而减小电压损失。易错点：误以为“换更大的变压器”能解决末端电压低。"},{"m":"M7","t":"单选","q":"架空线路的档距不宜过大，其主要目的是（　）。","o":["美观","节省电杆","便于检修","减小导线弧垂和杆塔受力"],"a":"D","e":"为什么：档距越大，导线自重导致的弧垂越大、杆塔受力越大，还容易发生导线间碰线短路。易错点：只从经济性考虑，把档距拉得很长。"},{"m":"M8","t":"判断","q":"扑救电气火灾时，使用水枪灭火只要与带电体保持一定距离就是安全的。","o":[],"a":"×","e":"为什么：一般水柱导电，高压水枪即使保持距离也可能因水流形成导电通路而触电，带电灭火应使用干粉、二氧化碳等不导电灭火剂。易错点：以为“水枪射得远就没事”。"},{"m":"M8","t":"判断","q":"在爆炸危险场所，铝芯导线严禁使用。","o":[],"a":"√","e":"为什么：铝芯易氧化、接触电阻大、易产生电火花，爆炸危险场所必须采用铜芯阻燃或铠装电缆并穿钢管保护。易错点：为省钱用铝芯线。"},{"m":"M8","t":"判断","q":"防雷装置安装完成后无需定期检测，坏了再修即可。","o":[],"a":"×","e":"为什么：接闪器锈蚀、引下线断裂、接地电阻变大都会使防雷失效，必须每年检测，接地电阻应≤10Ω。易错点：装了避雷针就“一劳永逸”。"},{"m":"M8","t":"单选","q":"干粉灭火器的压力表指针指在（　）区域表示可以正常使用。","o":["绿区","红区","黄区","白区"],"a":"A","e":"为什么：绿区表示压力正常；红区压力不足喷不出，黄区压力过高有爆裂风险。易错点：只看“有压力”不看颜色。"},{"m":"M8","t":"单选","q":"爆炸危险场所中，电气设备的金属外壳应（　）。","o":["不接地","可靠接地","接N线即可","接PEN线即可"],"a":"B","e":"为什么：可靠接地既能防止外壳带电，也能导走静电，避免静电火花引燃爆炸性混合物。易错点：认为“防爆设备本身就安全，不用接地”。"},{"m":"M8","t":"单选","q":"独立避雷针的接地装置与保护接地装置之间的距离一般不应小于（　）m。","o":["1m","3m","5m","10m"],"a":"B","e":"为什么：距离过近，雷击时高电位会通过土壤反击到保护接地系统，损坏设备或伤人。易错点：把两个接地极打在一起“图省事”。"},{"m":"M9","t":"单选","q":"图中电气图形符号表示什么元件？","o":["电容器","电感线圈","电阻器","熔断器"],"a":"C","e":"长方形框是电阻，文字符号 R，单位 Ω。看图三要点：空方框=电阻，方框里一条直线穿过=熔断器，两条平行线=电容。现场见到的色环电阻、水泥电阻，在图纸上都画这个方框。｜图形含义：长方形框，两边各引一根线，是电阻器的图形符号，文字符号 R，单位欧姆 Ω。作用是限制电流、分压、把电能变成热。识别要点：空方框就是电阻，方框里多一条直线穿过的才是熔断器。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h46'/><path d='M58 26h44v28H58z'/><path d='M102 40h56'/></svg>","gname":"图形符号：电阻器"},{"m":"M9","t":"单选","q":"图中符号比普通电阻多了一个箭头，它表示？","o":["电阻发热","电流方向","电阻被击穿","阻值可调的电阻（电位器）"],"a":"D","e":"箭头斜穿方框表示阻值“可调”，所以是可变电阻/电位器，代号 RP。这个箭头不是电流方向——箭头表示方向的只有二极管和发光管。｜图形含义：电阻框上斜穿一个箭头，箭头表示“可调”，所以是可变电阻或电位器，文字符号 RP。收音机音量旋钮后面就是它。注意：箭头是“可调”的意思，不是电流方向。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h46'/><path d='M58 26h44v28H58z'/><path d='M108 12L66 34'/><path d='M66 34l11-1'/><path d='M66 34l1-11'/><path d='M102 40h56'/></svg>","gname":"图形符号：可变电阻（电位器）"},{"m":"M9","t":"单选","q":"图中的两条等长平行线表示什么？","o":["电容器","常开触点","熔断器","电池"],"a":"A","e":"两条等长、等距的平行线是电容，代号 C，单位 F。一格直板+一格弯板才是电解电容。易错：电容两条线等长；触点的两条线是短竖线，还带引线和圆点。｜图形含义：两条等长、等距的平行线，是电容器的图形符号，文字符号 C，单位法拉 F。作用：充放电、隔直通交、提高功率因数。识别要点：两条线等长是电容，一长一短或一弯才是电解电容。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h58'/><path d='M70 20v40'/><path d='M80 20v40'/><path d='M80 40h78'/></svg>","gname":"图形符号：电容器"},{"m":"M9","t":"单选","q":"图中一块极板是弯的、旁边带“+”号，表示？","o":["蓄电池","电解电容器","稳压二极管","无极性电容"],"a":"B","e":"弯板 + “+”号 = 有极性的电解电容，正极必须接高电位。接反会鼓包、漏液甚至炸开；更换时容量和耐压都要不小于原件。｜图形含义：一格直板、一格弯板，再加一个“+”号，是有极性的电解电容。必须正接高电位、负接低电位，接反会漏液鼓包甚至炸开。更换时耐压值和容量都要不小于原来。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h56'/><path d='M68 20v40'/><path d='M82 20c11 7 11 33 0 40'/><path d='M50 20h12M56 14v12' stroke-width='2'/><path d='M92 40h66'/></svg>","gname":"图形符号：电解电容器"},{"m":"M9","t":"单选","q":"图中连续的几个半圆表示什么？","o":["电阻","电容","电感线圈（绕组）","熔断器"],"a":"C","e":"一串半圆表示绕组/线圈，代号 L，单位 H，通直流阻交流。电动机绕组、变压器绕组、接触器线圈在图上都画成半圆串。｜图形含义：一串半圆表示绕组或线圈，文字符号 L，单位亨利 H。作用：通直流、阻交流、储能。电动机绕组、变压器绕组、接触器线圈在图上都画成这种半圆串。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h32'/><path d='M44 40q9-17 18 0q9-17 18 0q9-17 18 0q9-17 18 0'/><path d='M116 40h42'/></svg>","gname":"图形符号：电感线圈（绕组）"},{"m":"M9","t":"单选","q":"图中三角形加一条竖线表示什么？","o":["三极管","晶闸管","稳压管","二极管"],"a":"D","e":"三角形是阳极、竖线是阴极，三角形指向就是允许电流的方向——单向导电。竖线两端加拐脚是稳压管，加双向外箭头是发光管。｜图形含义：三角形 + 一条竖线：三角形是阳极（P），竖线是阴极（N），三角形指向就是允许电流的方向。作用：单向导电、整流。识别要点：竖线两端加拐脚是稳压管，加向外箭头是发光管。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h48'/><path d='M60 22v36l34-18z'/><path d='M94 20v40'/><path d='M94 40h64'/></svg>","gname":"图形符号：二极管"},{"m":"M9","t":"单选","q":"图中二极管符号的竖线两端各多了一个拐脚，它表示？","o":["稳压二极管","发光二极管","普通二极管","隧道二极管"],"a":"A","e":"阴极上的两个拐脚是稳压管标志，代号 VS，工作在反向击穿区，用来稳压。易错：拐脚朝外=稳压管，双向外箭头=发光管。｜图形含义：二极管阴极两端各多一个“拐脚”，是稳压二极管，文字符号 VS（有的书用 VD）。它工作在反向击穿区，用来稳定电压；必须串限流电阻，不能单独并在线路上。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h48'/><path d='M60 22v36l34-18z'/><path d='M94 20v40'/><path d='M94 20h-11'/><path d='M94 60h11'/><path d='M94 40h64'/></svg>","gname":"图形符号：稳压二极管"},{"m":"M9","t":"单选","q":"图中二极管旁边有两个向外的箭头，表示？","o":["光敏二极管","发光二极管","稳压二极管","整流二极管"],"a":"B","e":"向外箭头=发光（LED），向内箭头=受光（光敏）。LED 长脚正、短脚负，必须串限流电阻，直接接 220V 立刻烧毁。｜图形含义：二极管旁边加两个向外的箭头，表示通电会发光。长脚是正极、短脚是负极。必须串限流电阻，直接接 12V 以上一下就烧；作指示灯、信号灯、显示屏用。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h48'/><path d='M60 22v36l34-18z'/><path d='M94 20v40'/><path d='M94 40h64'/><path d='M74 14l14-7'/><path d='M84 20l14-7'/><path d='M88 7l6 1-3 5z' fill='#1f3a5f' stroke='none'/><path d='M98 13l6 1-3 5z' fill='#1f3a5f' stroke='none'/></svg>","gname":"图形符号：发光二极管"},{"m":"M9","t":"单选","q":"图中三个电极、发射极带向外箭头的符号是？","o":["PNP 型三极管","晶闸管","NPN 型三极管","场效应管"],"a":"C","e":"箭头在发射极且向外 → NPN；向里 → PNP。记法：“N 出来”。三极分别是基极 b、集电极 c、发射极 e。｜图形含义：三个电极：竖线是基极 b，上面是集电极 c，下面带箭头的是发射极 e。箭头由内向外 → NPN；箭头由外向内 → PNP。记法：“N 出来”。作用是放大和开关，控制回路里常用来驱动继电器。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h58'/><path d='M70 24v32'/><path d='M70 32l28-14'/><path d='M98 18v-8'/><path d='M70 48l28 14'/><path d='M98 62v8'/><path d='M98 62l-11 1 5-9z' fill='#1f3a5f' stroke='none'/></svg>","gname":"图形符号：三极管（NPN）"},{"m":"M9","t":"单选","q":"图中二极管又引出一个控制极，表示？","o":["三极管","场效应管","单结晶体管","晶闸管（可控硅）"],"a":"D","e":"多出的门极（控制极）是晶闸管标志。特点是“触发后自保持”：一旦导通，门极就失去控制，只有电流降到维持电流以下才关断。用于调压、调速、整流。｜图形含义：二极管再引出一个控制极（门极），是晶闸管，俗称可控硅。特点：一旦触发导通，门极就失去控制，只有电流降到维持电流以下才关断。常用于调压、调速、整流。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h48'/><path d='M60 22v36l34-18z'/><path d='M94 20v40'/><path d='M94 40h64'/><path d='M80 52l14 14h16'/></svg>","gname":"图形符号：晶闸管（可控硅）"},{"m":"M9","t":"单选","q":"图中电阻旁的箭头指向电阻，表示？","o":["光敏电阻","发光二极管","压敏电阻","热敏电阻"],"a":"A","e":"箭头朝里=受光照影响，是光敏电阻，光照越强阻值越小，用于光控开关、路灯自动控制。箭头朝外才是发光器件。｜图形含义：电阻框加两个“向内”的箭头，表示受光照影响阻值，是光敏电阻。光照越强阻值越小，常用于光控开关、路灯自动控制。易错点：箭头朝外的是发光器件，朝里的是受光器件。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h46'/><path d='M58 26h44v28H58z'/><path d='M102 40h56'/><path d='M120 18l16 8'/><path d='M120 30l16 8'/><path d='M132 25l6 2-4 4z' fill='#1f3a5f' stroke='none'/></svg>","gname":"图形符号：光敏电阻"},{"m":"M9","t":"单选","q":"图中电阻框内有一个“U”形标记，表示？","o":["热敏电阻","压敏电阻","光敏电阻","可调电阻"],"a":"B","e":"“U”标记表示对电压敏感，是压敏电阻，用来吸收过电压、防浪涌雷击。正常时阻值极大，电压超阈值瞬间导通泄放能量，常并在电源进线两端。｜图形含义：电阻框里加一个“U”形标记，是压敏电阻，用来吸收过电压、防雷击浪涌。正常时阻值极大几乎不导电，电压一超过阈值就瞬间导通泄放能量。常并在电源进线两端。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h46'/><path d='M58 26h44v28H58z'/><path d='M102 40h56'/><path d='M64 40h32'/><path d='M96 34v12'/><path d='M64 34v12'/></svg>","gname":"图形符号：压敏电阻"},{"m":"M9","t":"单选","q":"图中电阻旁标“t°”，表示？","o":["压敏电阻","光敏电阻","热敏电阻","线绕电阻"],"a":"C","e":"标温度符号 t° 的是热敏电阻，用于测温、温度补偿和过热保护。别和热继电器混：热敏电阻是“测温元件”，热继电器是“保护电器”。｜图形含义：电阻框旁边标温度符号 t°，是热敏电阻。温度变化时阻值明显变化，用于测温、温度补偿和过热保护（如电机绕组里的 PTC）。易错点：热敏电阻是“测温元件”，热继电器是“保护电器”，别混。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h46'/><path d='M58 26h44v28H58z'/><path d='M102 40h56'/><text x='126' y='30' text-anchor='middle' font-size='14' fill='#1f3a5f' stroke='none' font-family='sans-serif'>t°</text><path d='M120 46l14-6'/></svg>","gname":"图形符号：热敏电阻"},{"m":"M9","t":"单选","q":"图中圆圈里写 M 表示？","o":["电能表","电流表","继电器","电动机"],"a":"D","e":"M 是电动机（Motor）。三相电动机还常标 3~ 或画 U1V1W1、U2V2W2 六个端子，接成 Y 或 △。实操最常接的就是它的正反转、点动、自锁线路。｜图形含义：圆圈里写 M 表示电动机。三相电动机还常标 3~ 或画出 U1V1W1、U2V2W2 六个接线端子，接成 Y 或 △。低压电工实操里最常接的就是它的正反转、点动、自锁线路。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='26'/><text x='85' y='47' text-anchor='middle' font-size='18' fill='#1f3a5f' stroke='none' font-family='sans-serif'>M</text><path d='M12 40h47'/><path d='M111 40h47'/></svg>","gname":"图形符号：三相异步电动机"},{"m":"M9","t":"单选","q":"图中圆圈里写 G 表示？","o":["发电机","电动机","电能表","接触器"],"a":"A","e":"G 是发电机（Generator），把机械能变成电能。它和电动机 M 恰好相反。自备发电机作备用电源时，必须与市电可靠闭锁，防止向电网反送电。｜图形含义：圆圈里写 G 表示发电机（Generator），是把机械能变成电能的电源设备。和电动机 M 恰好相反：M 是用电的，G 是发电的。自备发电机作备用电源时，必须与市电可靠闭锁，防止反送电。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='26'/><text x='85' y='47' text-anchor='middle' font-size='18' fill='#1f3a5f' stroke='none' font-family='sans-serif'>G</text><path d='M12 40h47'/><path d='M111 40h47'/></svg>","gname":"图形符号：发电机"},{"m":"M9","t":"单选","q":"图中两组绕组中间夹两条竖线，表示？","o":["电动机","变压器","接触器","互感器"],"a":"B","e":"两组绕组 + 铁芯（两条竖线）= 变压器，代号 T。作用只改变交流电压，不改变频率和功率。识别要点：一定有“铁芯”两竖线。｜图形含义：左右两组绕组夹着两条竖线（铁芯），表示变压器，文字符号 T。作用：改变交流电压，不改变频率、不改变功率（忽略损耗）。识别要点：两组绕组中间一定有“铁芯”两竖线。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h44'/><path d='M56 40q9-17 18 0q9-17 18 0'/><path d='M96 16v48'/><path d='M102 16v48'/><path d='M142 40q-9-17-18 0q-9-17-18 0'/><path d='M142 40h16'/></svg>","gname":"图形符号：变压器"},{"m":"M9","t":"单选","q":"图中一根导线穿过圆圈、圈内有绕组，表示？","o":["变压器","钳形电流表","电流互感器","电抗器"],"a":"C","e":"一次导线穿过铁芯、二次接表，是电流互感器 TA，把大电流按比例变成 5A/1A。铁律：二次侧绝对不许开路，拆表前必须先短接。｜图形含义：一次导线直接穿过铁芯圆圈，二次侧接小量程电流表，把大电流按比例变小（常见 5A 或 1A）。铁律：二次侧绝对不许开路，否则产生高压伤人、损设备；拆表前必须先短接。穿心式互感器还可以靠绕圈改变倍率。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><path d='M12 40h49'/><path d='M109 40h49'/><path d='M62 22q-8 18 0 36'/><path d='M108 22q8 18 0 36'/></svg>","gname":"图形符号：电流互感器"},{"m":"M9","t":"单选","q":"图中绕组并联在线路上、二次侧接电压表的设备是？","o":["电流互感器","变压器","电抗器","电压互感器"],"a":"D","e":"并联在线路上、二次侧输出 100V 的是电压互感器 TV。铁律：二次侧不许短路。读表时要按变比换算，例如 10kV/100V 的表读数乘 100。｜图形含义：一次绕组并联在高压线路上、二次侧接小量程电压表，把高电压按比例降低（常见 100V），这就是电压互感器 TV。铁律：二次侧不许短路，否则会烧毁。选表时要按变比换算实际电压。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><path d='M12 40h49'/><path d='M109 40h49'/><path d='M72 20v40'/><path d='M98 20v40'/></svg>","gname":"图形符号：电压互感器"},{"m":"M9","t":"单选","q":"图中一长一短的竖线交替出现，表示？","o":["蓄电池（直流电源）","电容器","电感","熔断器"],"a":"A","e":"长线为正极、短线为负极，是蓄电池/直流电源符号 GB。接线第一要务是认正负，接反会烧毁设备甚至炸。｜图形含义：长长的两条竖线是正极、短短的两条是负极，表示蓄电池或直流电源，文字符号 GB。长线为正、短线为负，这是识图和接线的第一要务；接反会烧毁设备。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h44'/><path d='M60 20v40'/><path d='M70 28v24'/><path d='M80 20v40'/><path d='M90 28v24'/><path d='M100 40h58'/></svg>","gname":"图形符号：蓄电池（直流电源）"},{"m":"M9","t":"单选","q":"图中方框内画锯齿形，表示？","o":["电阻器","电热元件（电热器）","电感线圈","熔断器"],"a":"B","e":"锯齿形代表电阻丝发热，是电热器/加热元件 EH。它功率大、电流大，导线截面和保护装置都要按额定电流选。｜图形含义：方框里画锯齿形（电阻丝），表示电热元件，如电炉、电热水器、电热毯的发热体。它把电能几乎全部变成热，功率大、电流大，导线截面和保护装置必须按额定电流选。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h44'/><rect x='56' y='26' width='58' height='28' rx='2'/><path d='M64 40l8-8 8 8 8-8 8 8 8-8'/><path d='M114 40h44'/></svg>","gname":"图形符号：电热器（加热元件）"},{"m":"M9","t":"单选","q":"图中“三横一竖、上宽下窄”的符号表示？","o":["避雷","绝缘","接地","屏蔽"],"a":"C","e":"标准接地符号。接设备外壳是保护接地，接防雷装置是防雷接地。必考数字：保护接地电阻 ≤4Ω，重复接地和防雷接地 ≤10Ω，防静电接地 ≤100Ω。｜图形含义：三横一竖、上宽下窄，是标准接地符号。接到设备外壳上就是保护接地：把外壳与大地可靠连接，人体碰到漏电外壳时电流走接地体而不走人体。保护接地电阻要求 ≤4Ω，这是必考数字。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M85 12v30'/><path d='M62 42h46'/><path d='M69 52h32'/><path d='M77 62h16'/></svg>","gname":"图形符号：保护接地"},{"m":"M9","t":"单选","q":"图中矩形框中间穿过一条直线，表示？","o":["电阻","断路器","接触器","熔断器"],"a":"D","e":"矩形中间一条直线 = 熔体，代号 FU，做短路保护。熔断后必须换同规格熔体，严禁铜丝代替——这是实操和事故案例里的高频考点。｜图形含义：矩形框中间一条直线穿过，表示熔断器，文字符号 FU。电流超过额定值一定时间后熔体熔断，切断电路，起短路保护，有的也兼过载保护。熔断后必须换同规格熔体，严禁用铜丝、铁丝代替。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h54'/><path d='M66 28h38v24H66z'/><path d='M12 40h146'/><path d='M104 40h54'/></svg>","gname":"图形符号：熔断器（保险丝）"},{"m":"M9","t":"单选","q":"图中开关上带一个自动脱扣标记，表示？","o":["断路器（自动开关）","刀开关","熔断器","隔离开关"],"a":"A","e":"断路器 = 开关 + 自动脱扣，过载、短路都能跳闸且可重复使用，代号 QF。它兼具刀开关的隔离作用和熔断器的保护作用。｜图形含义：开关上加一个“拐弯”的自动脱扣标记，是断路器（自动开关），文字符号 QF。既有开关的通断和隔离作用，又有过载、短路自动跳闸保护，故障排除后可重复合闸，这是它比熔断器方便的地方。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h40'/><circle cx='55' cy='40' r='3.5' fill='#1f3a5f' stroke='none'/><path d='M57 38l26-15'/><path d='M86 25l10 8-10 8'/><circle cx='96' cy='40' r='3.5' fill='#1f3a5f' stroke='none'/><path d='M96 40h62'/></svg>","gname":"图形符号：断路器（自动开关）"},{"m":"M9","t":"单选","q":"图中方框标 RCD，表示？","o":["断路器","剩余电流动作保护器（漏保）","熔断器","接触器"],"a":"B","e":"RCD 就是漏电保护器，检测火线与零线电流差，超过 30mA 跳闸。它只是附加保护：不能代替接地接零；两相触电（同时碰两根火线）时它不动作。｜图形含义：方框内标 RCD，是剩余电流动作保护器，也就是我们常说的“漏保”。它检测火线与零线电流是否相等，差值超过 30mA 就跳闸。注意：它是附加保护，不能代替接地和接零；人同时碰两根火线（两相触电）时它不动作。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='50' y='24' width='66' height='32' rx='3'/><text x='83' y='45' text-anchor='middle' font-size='15' fill='#1f3a5f' stroke='none' font-family='sans-serif'>RCD</text><path d='M12 40h38'/><path d='M116 40h42'/></svg>","gname":"图形符号：剩余电流动作保护器（漏保）"},{"m":"M9","t":"单选","q":"图中方框内画双金属片，表示？","o":["熔断器","接触器","热继电器","时间继电器"],"a":"C","e":"双金属片受热弯曲推动触点，是热继电器 FR。它做电动机长期过载保护，不能代替熔断器做短路保护——这个区别每年都考。｜图形含义：方框里画一段双金属片，是热继电器，文字符号 FR。电动机过载时电流大、发热元件弯曲，推动常闭触点断开，切断接触器线圈，从而保护电动机。它只做长期过载保护，不能代替熔断器做短路保护。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h44'/><rect x='56' y='20' width='44' height='28' rx='2'/><text x='82' y='45' text-anchor='middle' font-size='12' fill='#1f3a5f' stroke='none' font-family='sans-serif'>FR</text><path d='M64 34q8-10 16 0'/><path d='M100 40h12'/><circle cx='96' cy='40' r='0'/><path d='M112 40h46'/></svg>","gname":"图形符号：热继电器"},{"m":"M9","t":"单选","q":"图中两个电极留间隙、下端接地，表示？","o":["熔断器","电容器","接地开关","避雷器"],"a":"D","e":"间隙 + 接地 = 避雷器 F。正常不通电，遇雷击或操作过电压瞬间导通泄放。低压常用氧化锌避雷器，安装在电源进线处。｜图形含义：两片电极之间留间隙，下端接地，是避雷器（过电压保护器），文字符号 F。正常时不通电，出现雷击或操作过电压时瞬间导通，把能量泄放到大地，保护后面的设备。低压常用氧化锌避雷器。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h32'/><path d='M44 40l12-9v18z'/><path d='M72 40l-12-9v18z'/><path d='M72 40h36'/><path d='M58 49v9'/><path d='M47 58h22'/><path d='M52 64h12'/></svg>","gname":"图形符号：避雷器（保护间隙）"},{"m":"M9","t":"单选","q":"图中带圆点和斜杆的符号表示？","o":["手动开关（单极）","熔断器","按钮","插座"],"a":"A","e":"一个动触点 + 一个静触点 + 操作手柄 = 手动开关 SA。开关必须控制火线；接在零线上关灯后灯头仍带电。｜图形含义：一个动触点、一个静触点，加操作手柄，是手动单极开关，文字符号 SA。用在照明回路上就是灯开关。铁律：开关必须控制火线，接在零线上关灯后灯头仍带电，换灯泡会触电。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h40'/><circle cx='55' cy='40' r='3.5' fill='#1f3a5f' stroke='none'/><path d='M57 38l28-16'/><circle cx='88' cy='40' r='3.5' fill='#1f3a5f' stroke='none'/><path d='M88 40h70'/></svg>","gname":"图形符号：单极开关（手动）"},{"m":"M9","t":"单选","q":"图中两个刀用虚线连在一起，表示？","o":["单极开关","双极开关（双控）","断路器","刀熔开关"],"a":"B","e":"两刀联动（虚线相连）是双极/双控开关，同时通断两条线。楼梯两地控制同一盏灯、三相设备总开关都用它。双控接错会出现“两个都能开、都不能关”。｜图形含义：两个刀联动（虚线相连），是双极开关/双控开关，同时通断两条线。楼梯上下两个开关控制同一盏灯、三相设备的总开关都用它。注意：双控开关两端接线要“配对”，接错灯会出现“两个都能开、都不能关”的怪现象。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 30h40'/><circle cx='52' cy='30' r='3' fill='#1f3a5f' stroke='none'/><path d='M54 29l24-11'/><circle cx='86' cy='30' r='3' fill='#1f3a5f' stroke='none'/><path d='M86 30h72'/><path d='M12 50h40'/><circle cx='52' cy='50' r='3' fill='#1f3a5f' stroke='none'/><path d='M54 49l24 11'/><circle cx='86' cy='50' r='3' fill='#1f3a5f' stroke='none'/><path d='M86 50h72'/><path d='M70 20v-6h30v6' stroke-dasharray='5 4' stroke-width='1.6'/></svg>","gname":"图形符号：双极开关（双控）"},{"m":"M9","t":"单选","q":"图中触点平时断开、顶部有按钮帽，表示？","o":["常闭按钮（停止）","行程开关","常开按钮（启动）","接触器触点"],"a":"C","e":"平时断开、按下接通 = 常开按钮，一般绿色做“启动”。它与接触器常开辅助触点并联实现自锁：松手后靠自锁触点保持吸合。｜图形含义：触点平时断开、按下才接通，顶上多一横是按钮帽，是常开按钮，代号 SB，一般用绿色作启动。电动机控制电路里它与接触器常开辅助触点并联，实现“按下启动、松手自锁”。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h40'/><circle cx='55' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M57 38l26-13'/><circle cx='86' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M86 40h72'/><path d='M70 24v-9'/><path d='M60 15h20'/></svg>","gname":"图形符号：常开按钮（启动）"},{"m":"M9","t":"单选","q":"图中触点平时闭合、顶部有按钮帽，表示？","o":["常开按钮（启动）","熔断器","热继电器","常闭按钮（停止）"],"a":"D","e":"平时闭合、按下断开 = 常闭按钮，一般红色做“停止”。它串在线圈回路里，一按就断线圈电。实操易错：停按钮接成常开，按下停不下来。｜图形含义：触点平时闭合、按下才断开，顶上同样有按钮帽，是常闭按钮，一般用红色作停止。它串在接触器线圈回路里，一按就切断线圈电源、主触点释放、电动机停转。易错点：停按钮接成常开就停不下来。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h40'/><circle cx='55' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M57 40h29'/><circle cx='86' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M86 40h72'/><path d='M70 40v-8M62 24h16M70 24v6'/><path d='M70 18v-4'/></svg>","gname":"图形符号：常闭按钮（停止）"},{"m":"M9","t":"单选","q":"图中开关连杆上带一个滚轮，表示？","o":["行程开关（限位开关）","按钮","旋钮开关","刀开关"],"a":"A","e":"带滚轮的开关是行程开关 SQ，机械运动到位时压下滚轮使触点动作，实现到位停止、自动往返、限位保护。行车、电梯、机床都用它。｜图形含义：开关的连杆上带一个滚轮，是行程开关（限位开关），文字符号 SQ。机械运动到位置时压下滚轮，触点动作，实现到位停止、自动往返、限位保护。行车、电梯、机床的“到顶停”都靠它。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h40'/><circle cx='52' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M54 38l28-14'/><circle cx='84' cy='40' r='3' fill='#1f3a5f' stroke='none'/><path d='M84 40h74'/><path d='M82 24v-8'/><circle cx='82' cy='12' r='4'/></svg>","gname":"图形符号：行程开关（限位开关）"},{"m":"M9","t":"单选","q":"图中一个矩形框、两端各引一根线，框内标 KM，表示？","o":["熔断器","接触器线圈","电阻","电容器"],"a":"B","e":"矩形框是线圈（电磁铁），代号 KM。线圈通电吸合 → 主触点闭合 → 电动机得电。线圈电压常见 220V/380V，接线前必须核对铭牌。｜图形含义：矩形框代表线圈（电磁铁），是交流接触器的线圈，文字符号 KM。线圈通电产生磁力吸合衔铁，带动主触点闭合让电动机得电，同时带动辅助触点动作。线圈电压常见 220V 或 380V，接线前必须核对铭牌。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='62' y='28' width='46' height='24' rx='3'/><text x='85' y='46' text-anchor='middle' font-size='15' fill='#1f3a5f' stroke='none' font-family='sans-serif'>KM</text><path d='M12 40h50'/><path d='M108 40h50'/></svg>","gname":"图形符号：接触器线圈"},{"m":"M9","t":"单选","q":"图中方框内标 KA，表示？","o":["接触器","时间继电器","中间继电器","热继电器"],"a":"C","e":"KA 是中间继电器，用来扩大触点数量、传递信号、把弱电控制转成强电控制。触点容量小，不能直接带电动机，只能驱动接触器线圈。｜图形含义：方框内标 KA，是中间继电器。作用不是直接带负载，而是“扩大触点数量、传递信号、把弱电控制转成强电控制”。触点容量小，不能直接控制电动机，只能去驱动接触器线圈。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='56' y='26' width='58' height='28' rx='3'/><text x='85' y='46' text-anchor='middle' font-size='16' fill='#1f3a5f' stroke='none' font-family='sans-serif'>KA</text><path d='M12 40h44'/><path d='M114 40h44'/></svg>","gname":"图形符号：中间继电器"},{"m":"M9","t":"单选","q":"图中线圈框上方带一段延时弧线、框内标 KT，表示？","o":["中间继电器","接触器","热继电器","时间继电器"],"a":"D","e":"带延时弧线的是时间继电器 KT，通电或断电后延迟一段时间才动作，用于电动机 Y-△ 降压启动、顺序控制、延时停机。分通电延时和断电延时两种。｜图形含义：方框上带一段延时弧线（半圆加箭头），是时间继电器，文字符号 KT。通电或断电后延迟一段时间触点才动作，用于电动机 Y-△ 降压启动、顺序控制、延时停机。分“通电延时”和“断电延时”两种，看弧线朝哪边。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='56' y='26' width='44' height='28' rx='3'/><text x='78' y='45' text-anchor='middle' font-size='14' fill='#1f3a5f' stroke='none' font-family='sans-serif'>KT</text><path d='M60 22q11-12 22 0'/><path d='M104 40h10'/><path d='M100 40h4'/><path d='M12 40h44'/><path d='M114 40h44'/></svg>","gname":"图形符号：时间继电器"},{"m":"M9","t":"单选","q":"图中线圈框外接一根可动阀杆、框内标 YV，表示？","o":["电磁阀","接触器","电磁铁","限位开关"],"a":"A","e":"电磁阀 YV，通电开/关管路，控制水、气、油。必须搞清失电时的开闭状态（常开/常闭），否则断电会出事故。｜图形含义：线圈框外加一根可动的阀杆，是电磁阀，文字符号 YV。通电吸合打开/关闭管路，控制水、气、油。消防、空调、气动设备上大量使用；失电时的开闭状态（常开/常闭）必须搞清，否则断电会出事。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='56' y='26' width='40' height='28' rx='3'/><text x='76' y='45' text-anchor='middle' font-size='14' fill='#1f3a5f' stroke='none' font-family='sans-serif'>YV</text><path d='M96 40h40'/><path d='M128 34v12'/><path d='M118 40h20'/><path d='M12 40h44'/></svg>","gname":"图形符号：电磁阀"},{"m":"M9","t":"单选","q":"图中线圈框外接一个横杠衔铁、框内标 YA，表示？","o":["电磁阀","电磁铁（电磁制动器）","接触器","变压器"],"a":"B","e":"电磁铁 YA。起重机的制动器就是它：通电松闸、断电抱闸，所以断电时是安全的“刹车”状态。｜图形含义：线圈框外接一个衔铁（横杠），是电磁铁或电磁制动器，文字符号 YA。通电吸合松开制动，断电靠弹簧抱闸——所以起重机、卷扬机断电时是“刹车”状态，这是安全设计。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='56' y='26' width='40' height='28' rx='3'/><text x='76' y='45' text-anchor='middle' font-size='14' fill='#1f3a5f' stroke='none' font-family='sans-serif'>YA</text><path d='M96 40h34'/><path d='M130 32v16'/><path d='M12 40h44'/></svg>","gname":"图形符号：电磁铁（制动器）"},{"m":"M9","t":"单选","q":"图中圆圈里画叉的符号表示？","o":["电动机","熔断器","照明灯（白炽灯）","指示灯座"],"a":"C","e":"圆圈画叉 = 照明灯具 EL。螺口灯座中心触点接火线、螺纹接零线；开关控制火线。｜图形含义：圆圈里画叉，表示照明灯具（白炽灯/通用灯），文字符号 EL。接线要点：螺口灯座的中心触点接火线、螺纹接零线，这样换灯泡时手碰不到带电部分；开关控制火线。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><path d='M68 23l34 34M102 23l-34 34'/><path d='M12 40h49'/><path d='M109 40h49'/></svg>","gname":"图形符号：白炽灯（照明灯）"},{"m":"M9","t":"单选","q":"图中长条圆角矩形表示？","o":["母线","熔断器","电缆","荧光灯（日光灯）"],"a":"D","e":"长条圆角矩形是荧光灯管 FL，必须配镇流器和启辉器才能点亮，不能直接接 220V。灯管两头红而不亮，多半是启辉器或灯管坏了。｜图形含义：长条圆角矩形是荧光灯管，文字符号 FL。它必须配镇流器（或电子镇流器）和启辉器才能点亮，不能像白炽灯那样直接接 220V。老式电感镇流器功率因数低，坏了常表现为“灯管两头红、不亮”。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h38'/><rect x='50' y='32' width='70' height='16' rx='8'/><path d='M50 32v16'/><path d='M120 32v16'/><path d='M120 40h38'/></svg>","gname":"图形符号：荧光灯（日光灯）"},{"m":"M9","t":"单选","q":"图中半圆内三个孔的符号表示？","o":["单相三孔插座","三相插座","按钮","接线端子"],"a":"A","e":"三孔插座，接线铁律“左零右火上接地”。地线孔绝不能空着或接零线，否则金属外壳漏电时人会触电。｜图形含义：半圆里有三个孔，是单相三孔插座，文字符号 XS。接线铁律：左零右火上接地（面对插座看）。地线孔在上方或下方，必须接 PE 线，绝不能空着或接到零线上。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M58 62a27 27 0 0 1 54 0'/><path d='M72 62V46'/><path d='M98 62V46'/><path d='M85 62v12'/></svg>","gname":"图形符号：单相三孔插座"},{"m":"M9","t":"单选","q":"图中半圆内两个孔的符号表示？","o":["三孔插座","单相两孔插座","插头","接线盒"],"a":"B","e":"两孔插座只有火线和零线，没有保护地线，只能接双重绝缘（塑料外壳）的电器。金属外壳电器必须用三孔插座。｜图形含义：半圆里两个孔，是单相两孔插座，只有火线和零线，没有保护地线。只能接双重绝缘的Ⅱ类电器（如塑料外壳充电器）；金属外壳电器必须用三孔插座，否则漏电时外壳带电。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M62 62a23 23 0 0 1 46 0'/><path d='M74 62V48'/><path d='M96 62V48'/></svg>","gname":"图形符号：单相两孔插座"},{"m":"M9","t":"单选","q":"图中半圆内四个孔的符号表示？","o":["三相五孔插座","单相三孔插座","三相四孔插座","接线端子"],"a":"C","e":"三相四孔插座 = 三根相线 + 一根保护地线，供三相设备使用。接错会导致电动机反转或外壳带电。｜图形含义：半圆里四个孔（三根相线 + 一根保护地线），是三相四孔插座，供三相设备使用。四个孔不能接错：三根相线接 L1L2L3，最上面（或最大）的孔接地线。接错会导致电动机反转或外壳带电。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M52 66a33 33 0 0 1 66 0'/><path d='M68 66V50'/><path d='M85 66V46'/><path d='M102 66V50'/><path d='M85 66v10'/></svg>","gname":"图形符号：三相四孔插座"},{"m":"M9","t":"单选","q":"图中插头与插座的配套图形表示？","o":["接线端子","熔断器","开关","插头（插接器件）"],"a":"D","e":"插头 XP 插进插座 XS 取电。插脚数量是关键：两脚无地线、三脚有地线。检修必须先拔插头，大功率负载不能带电插拔。｜图形含义：插头与插座是一对：插头插入插座取电。识图时注意插脚数量——两脚无地线、三脚有地线。插头、插座、耦合器都属于“插接器件”，检修时必须先拔插头断电，不能带电插拔大功率负载。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M42 26h34v28H42z'/><path d='M76 32h24'/><path d='M76 48h24'/><path d='M100 32h10v-6'/><path d='M100 48h10v6'/></svg>","gname":"图形符号：插头"},{"m":"M9","t":"单选","q":"图中三条粗实线并排表示？","o":["三相母线（汇流排）","电缆","导线束","接地线"],"a":"A","e":"三条粗线并排是三相母线 W，配电柜里集中分配电能的主干线。母线裸露带电，人体与带电体安全距离 ≥0.1m；检修必须停电、验电、装接地线、挂标示牌。｜图形含义：三条粗实线并排，表示三相母线（汇流排），是配电柜里集中分配电能的主干线。母线带电且裸露，操作时安全距离 ≥0.1m；检修必须停电、验电、装设接地线、挂标示牌。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 26h130' stroke-width='5'/><path d='M20 40h130' stroke-width='5'/><path d='M20 54h130' stroke-width='5'/></svg>","gname":"图形符号：母线"},{"m":"M9","t":"单选","q":"图中导线上画一个小圆圈表示？","o":["插座","接线端子","熔断器","指示灯"],"a":"B","e":"小圆圈是接线端子 XT，用于导线与设备、导线与导线的可拆卸连接。一个端子最多接两根线，多股线要压接端子或搪锡。｜图形含义：导线上画一个小圆圈，表示接线端子（端子排），文字符号 XT。用于导线与设备、导线与导线的可拆卸连接。要求：一个端子最多接两根线，多股线要压接端子或搪锡，不能把铜丝直接拧成一股。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 40h62'/><circle cx='85' cy='40' r='7' fill='#fff'/><path d='M92 40h66'/></svg>","gname":"图形符号：接线端子"},{"m":"M9","t":"单选","q":"图中方框里标 Wh 的符号表示？","o":["电压表","电流表","电能表","万用表"],"a":"C","e":"Wh 是电能单位（瓦时），标 Wh 的方框是电能表 PJ。单相表接线 1、3 进、2、4 出；装好后核对转向，反转说明进线接错。｜图形含义：方框内标 Wh（瓦时），是电能表，文字符号 PJ，计量用电量。单相表接线：1、3 进，2、4 出（1 火进、2 火出、3 零进、4 零出）。装表后要核对转向，反转说明进出线接错。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='57' y='22' width='56' height='36' rx='3'/><text x='85' y='47' text-anchor='middle' font-size='17' fill='#1f3a5f' stroke='none' font-family='sans-serif'>Wh</text><path d='M12 40h45'/><path d='M113 40h45'/></svg>","gname":"图形符号：电能表（电度表）"},{"m":"M9","t":"单选","q":"图中圆圈里写 A，且要求串联接入电路，它是？","o":["电压表","功率表","电能表","电流表"],"a":"D","e":"圆圈写 A 是电流表 PA，必须串联、选合适量程，测大电流配电流互感器。铁律：电流表绝不许并联在电源两端，那等于短路。｜图形含义：圆圈里写 A，是电流表，文字符号 PA。必须串联在被测电路中，且要选合适量程；测量大电流时配电流互感器。铁律：电流表绝不能并联在电源两端，那等于短路。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><text x='85' y='47' text-anchor='middle' font-size='18' fill='#1f3a5f' stroke='none' font-family='sans-serif'>A</text><path d='M12 40h49'/><path d='M109 40h49'/></svg>","gname":"图形符号：电流表"},{"m":"M9","t":"单选","q":"图中圆圈里写 V，且要求并联接入电路，它是？","o":["电压表","电流表","功率表","频率表"],"a":"A","e":"圆圈写 V 是电压表 PV，必须并联、内阻极大。测高压要配电压互感器。铁律：电压表不能串联，串进去电路就断了。｜图形含义：圆圈里写 V，是电压表，文字符号 PV。必须并联在被测两点之间，内阻很大所以不会影响电路。测量高压要配电压互感器。铁律：电压表不能串联，串进去电路就断了。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><text x='85' y='47' text-anchor='middle' font-size='18' fill='#1f3a5f' stroke='none' font-family='sans-serif'>V</text><path d='M12 40h49'/><path d='M109 40h49'/></svg>","gname":"图形符号：电压表"},{"m":"M9","t":"单选","q":"图中圆圈里写 W 的仪表是？","o":["电能表","功率表","电压表","万用表"],"a":"B","e":"圆圈写 W 是功率表 PW，直接读有功功率（瓦）。它同时有电压线圈和电流线圈，接反指针会反转。电工证一般只考认符号。｜图形含义：圆圈里写 W，是功率表，文字符号 PW，直接读出有功功率（瓦）。它同时有电压线圈和电流线圈，接线比普通表复杂，接反指针会反转。电工证考试里一般只考“认符号”。","g":"<svg viewBox='0 0 170 80' xmlns='http://www.w3.org/2000/svg' fill='none' stroke='#1f3a5f' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><circle cx='85' cy='40' r='24'/><text x='85' y='47' text-anchor='middle' font-size='18' fill='#1f3a5f' stroke='none' font-family='sans-serif'>W</text><path d='M12 40h49'/><path d='M109 40h49'/></svg>","gname":"图形符号：功率表"},{"m":"M10","t":"单选","q":"图中指针位置如图，转换开关置于交流 250V 档，读数应为（　）。","o":["175V","150V","200V","175A"],"a":"A","e":"为什么：250V 档满刻度就是 250，指针停在 175 的刻度线上，直接读 175V。易错点：把“刻度值”和“量程”混为一谈，或者把单位看成 A。", var MODS = [["M1", "安全生产法规与证件管理"], ["M2", "电工基础与电路计算"], ["M3", "电工仪表与测量"], ["M4", "触电危害与现场急救"], ["M5", "防触电技术：绝缘·接地·漏保"], ["M6", "低压电器与电动机"], ["M7", "配电线路·照明·插座"], ["M8", "电气防火防爆·防雷防静电"], ["M9", "图形题：电气符号识别"], ["M10", "整图判读：表盘·标志·电路"]];
var KEY = 'dg_wrong_v1';
var app = document.getElementById('app');

function wrongIds(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function saveWrong(ids){ try{ localStorage.setItem(KEY, JSON.stringify(ids)); }catch(e){} }
function addWrong(id){ var a=wrongIds(); if(a.indexOf(id)<0){ a.push(id); saveWrong(a);} }
function delWrong(id){ saveWrong(wrongIds().filter(function(x){return x!==id;})); }

var S = { list: [], i: 0, answers: [], mode: '' };

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function renderHome(){
  var w = wrongIds().length;
  var h = '<div class="card" style="padding:0"><a class="btn" href="learn.html" style="display:block;text-align:center;text-decoration:none;margin:14px">📖 零基础入门 · 十六讲（建议先看）</a></div>';
  h += '<div class="card"><h2>开始练习</h2>';
  h += '<button class="btn" onclick="start(\'all\')">顺序练习 · 全部 505 题</button>';
  h += '<button class="btn ghost" onclick="start(\'rand\')">随机抽 30 题 · 模拟考</button>';
  h += '<button class="btn '+(w?'warn':'ghost')+'" onclick="start(\'wrong\')">错题重做（'+w+' 题）</button>';
  h += '</div><div class="card"><h2>按模块练习</h2><div class="grid">';
  MODS.forEach(function(m){
    var n = BANK.filter(function(q){return q.m===m[0];}).length;
    h += '<button class="btn ghost" style="text-align:left" onclick="start(\''+m[0]+'\')">'+m[0]+' '+m[1]+'<br><span class="muted">'+n+' 题</span></button>';
  });
  h += '</div></div>';
  if(w){ h += '<button class="btn" style="background:#fff;color:#c62828" onclick="clearWrong()">清空错题记录</button>'; }
  app.innerHTML = h;
}

function start(mode){
  S.mode = mode;
  if(mode==='all'){ S.list = BANK.slice(); }
  else if(mode==='rand'){ S.list = shuffle(BANK).slice(0,30); }
  else if(mode==='wrong'){ var ids=wrongIds(); S.list = BANK.filter(function(q){return ids.indexOf(q.id)>=0;}); }
  else { S.list = BANK.filter(function(q){return q.m===mode;}); }
  if(!S.list.length){ alert('没有题目'); return; }
  S.i = 0; S.answers = new Array(S.list.length).fill(null);
  renderQ();
}

function renderQ(){
  var q = S.list[S.i], n = S.list.length;
  var pct = Math.round(S.i / n * 100);
  var modName = '';
  MODS.forEach(function(m){ if(m[0]===q.m) modName = m[1]; });
  var h = '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  h += '<div class="qmeta"><span><button class="hbtn" onclick="renderHome()">‹ 主页</button>第 '+(S.i+1)+' / '+n+' 题</span><span class="tag">'+q.t+' · '+modName+'</span></div>';
  h += '<div class="card"><div class="qtext">'+q.q+'</div>';
  if(q.g){ h += '<div class="fig">'+q.g+'</div>'; }
  if(q.t==='判断'){
    h += '<button class="opt" id="o0" onclick="pick(0,\'√\')"><b>A</b><span>正确 √</span></button>';
    h += '<button class="opt" id="o1" onclick="pick(1,\'×\')"><b>B</b><span>错误 ×</span></button>';
  } else {
    var letters = ['A','B','C','D'];
    q.o.forEach(function(o,k){
      h += '<button class="opt" id="o'+k+'" onclick="pick('+k+',\''+letters[k]+'\')"><b>'+letters[k]+'</b><span>'+o+'</span></button>';
    });
  }
  h += '<div class="fb" id="fb"></div></div>';
  h += '<div class="row"><button class="btn ghost" onclick="prev()" '+(S.i===0?'disabled':'')+'>上一题</button>';
  h += '<button class="btn" id="nextBtn" onclick="next()" disabled>下一题</button></div>';
  app.innerHTML = h;
  if(S.answers[S.i]) { restore(q); }
}

function pick(k, val){
  if(S.answers[S.i]) return;
  var q = S.list[S.i];
  S.answers[S.i] = val;
  var ok = (val === q.a);
  document.querySelectorAll('.opt').forEach(function(el){ el.classList.add('dim'); });
  var chosen = document.getElementById('o'+k);
  chosen.classList.remove('dim'); chosen.classList.add(ok?'right':'wrong');
  if(!ok){
    addWrong(q.id);
    // 标出正确项
    if(q.t==='判断'){ document.getElementById(q.a==='√'?'o0':'o1').classList.remove('dim'); }
    else { document.getElementById('o'+'ABCD'.indexOf(q.a)).classList.remove('dim'); }
  }
  showFb(q, ok);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').textContent = (S.i===S.list.length-1) ? '查看结果' : '下一题';
}

function showFb(q, ok){
  var fb = document.getElementById('fb');
  fb.className = 'fb show ' + (ok?'ok':'no');
  var ansText = q.t==='判断' ? (q.a==='√'?'正确':'错误') : q.a;
  fb.innerHTML = '<div class="ans">'+(ok?'✅ 答对了':'❌ 答错了')+'　正确答案：'+ansText+'</div><div>'+q.e+'</div>';
}

function restore(q){
  var val = S.answers[S.i];
  if(!val) return;
  var ok = (val===q.a);
  if(q.t==='判断'){
    document.getElementById(val==='√'?'o0':'o1').classList.add(ok?'right':'wrong');
  } else {
    document.getElementById('o'+'ABCD'.indexOf(val)).classList.add(ok?'right':'wrong');
  }
  showFb(q, ok);
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('nextBtn').textContent = (S.i===S.list.length-1) ? '查看结果' : '下一题';
}

function prev(){ if(S.i>0){ S.i--; renderQ(); } }
function next(){ if(S.i < S.list.length-1){ S.i++; renderQ(); } else { renderResult(); } }

function renderResult(){
  var right=0, wrongList=[];
  S.list.forEach(function(q,k){
    if(S.answers[k]===q.a){ right++; } else { wrongList.push(q); }
  });
  var total = S.list.length, score = Math.round(right/total*100);
  var h = '<div class="card"><div class="big">'+score+'</div>';
  h += '<p style="text-align:center;margin:2px 0 0" class="muted">'+(score>=80?'✅ 达到合格线（80分）':'⚠️ 未达合格线（80分），继续加油')+'</p>';
  h += '<div class="stat"><div><span>'+total+'</span><small>总题数</small></div>';
  h += '<div><span style="color:#2e7d32">'+right+'</span><small>答对</small></div>';
  h += '<div><span style="color:#c62828">'+(total-right)+'</span><small>答错</small></div></div></div>';
  if(wrongList.length){
    h += '<div class="card"><h2>本次错题（'+wrongList.length+'）</h2>';
    wrongList.forEach(function(q){
      h += '<div class="wrongitem"><b>'+q.q+'</b>'+(q.g?'<div class="fig">'+q.g+'</div>':'')+'<div class="e">答案：'+(q.t==='判断'?(q.a==='√'?'正确':'错误'):q.a)+'　'+q.e+'</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="row"><button class="btn ghost" onclick="renderHome()">回首页</button>';
  h += '<button class="btn" onclick="start(S.mode)">再练一遍</button></div>';
  app.innerHTML = h;
}

function clearWrong(){ if(confirm('确定清空错题记录？')){ saveWrong([]); renderHome(); } }
